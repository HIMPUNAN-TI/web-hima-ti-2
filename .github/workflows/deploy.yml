name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, mysql, pdo_mysql, bcmath, gd, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install NPM dependencies & Build Assets
        run: |
          npm ci
          npm run build

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Navigating to project directory..."
            cd ${{ secrets.VPS_DEPLOY_PATH || '/var/www/web-hima-ti-2' }}

            echo "📦 Pulling latest changes from main..."
            git pull origin main

            echo "📥 Installing Composer dependencies..."
            composer install --no-dev --optimize-autoloader --no-interaction

            echo "📦 Installing Node dependencies & Building assets on server..."
            npm ci
            npm run build

            echo "🗄️ Running migrations..."
            php artisan migrate --force

            echo "⚡ Optimizing Laravel caches..."
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔄 Restarting Queue worker & PHP-FPM (if configured)..."
            php artisan queue:restart || true
            sudo systemctl reload nginx || true
            sudo systemctl reload php8.2-fpm || true

            echo "✅ Deployment successful!"
